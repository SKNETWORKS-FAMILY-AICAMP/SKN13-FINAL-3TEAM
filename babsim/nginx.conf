upstream django {
    # Django Gunicorn 컨테이너의 서비스 이름과 포트
    server django_gunicorn:8000;
}

upstream vllm {
    # vLLM API 서버 (SSH 터널링을 통해 연결)
    # Docker 호스트의 SSH 터널링된 포트에 접근
    server host.docker.internal:8000;  # Docker 호스트의 로컬 포트
}

server {
    listen 80;
    server_name localhost;

    # React App (정적 파일 서빙)
    # 루트 경로('/')로 들어오는 요청은 React 빌드 파일을 제공합니다.
    location / {
        root /usr/share/nginx/html; # docker-compose.yml에서 마운트한 React 빌드 폴더
        try_files $uri /index.html; # React Router와 같은 클라이언트 사이드 라우팅 지원
    }

    # /static/ URL은 staticfiles 볼륨에서 직접 파일을 제공합니다.
    location /static/ {
        alias /app/staticfiles/;
    }

    # /api/로 시작하는 모든 요청을 Django로 프록시
    # React 앱에서 보내는 API 요청을 Django 컨테이너로 전달합니다.
    # API 및 Django 관련 모든 경로를 Django로 전달 (Back-end 처리)
    # /api/, /auth/, /admin/, /chat/, /users/ 로 시작하는 모든 경로를 포함
    location ~ ^/(api|auth|admin|chat|users|accounts)/ {
        proxy_pass http://django;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s; 
        
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_redirect off;
    }
        
    # Django admin 페이지를 위한 프록시 (선택 사항)
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
    
    # vLLM API 프록시 (SSH 터널링을 통해 연결)
    location /vllm/ {
        proxy_pass http://vllm/;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_redirect off;
    }

    # Embedding API 프록시
    location /embed/ {
        proxy_pass http://embedding_api:8002/;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
