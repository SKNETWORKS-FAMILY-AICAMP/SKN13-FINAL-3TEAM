
services:
  # Django + Gunicorn 서비스
  django_gunicorn:
    build:
      context: . # Dockerfile이 있는 현재 디렉토리
      dockerfile: Dockerfile
    command: >
      sh -c "
        apk add --no-cache netcat-openbsd &&
        chmod +x /wait-for-it.sh &&
        /wait-for-it.sh inference-server:8001 --
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 180
      "
    volumes:
      - .:/app # 호스트의 현재 디렉토리를 컨테이너의 /app에 마운트 (개발 시 코드 변경 반영)
      - /app/node_modules # frontend/node_modules는 호스트에서 제외 (volume으로 덮어쓰지 않음)
      - ./mediafiles:/app/mediafiles
    expose:
      - "8000" # Nginx에서 접근할 포트
    env_file:
      - .env # .env 파일에서 환경 변수 로드
    depends_on:
      - postgres
      - qdrant # Qdrant 컨테이너에 의존성 설정e
      - inference-server

  # Nginx 서비스
  nginx:
    image: nginx:latest
    ports:
      - "80:80" # 호스트의 80번 포트를 컨테이너의 80번 포트에 매핑
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # Nginx 설정 파일 마운트
      - ./react/build:/usr/share/nginx/html:ro      # React 빌드 결과물 마운트
    depends_on:
      - django_gunicorn # Django Gunicorn 서비스에 의존성 설정

  # PostgreSQL 서비스
  postgres:
    image: postgres:15-alpine # 경량 PostgreSQL 이미지
    volumes:
      - postgres_data:/var/lib/postgresql/data # 데이터 영속성 유지
    env_file:
      - .env # .env 파일에서 DB 환경 변수 로드
    expose:
      - "5432" # 다른 컨테이너에서 접근할 포트

  # Qdrant 서비스
  qdrant:
    image: qdrant/qdrant:latest # Qdrant 이미지
    volumes:
      - qdrant_data:/qdrant/storage # 데이터 영속성 유지
    env_file:
      - .env # .env 파일에서 Qdrant 환경 변수 로드
    expose:
      - "6333" # Qdrant REST API 포트
      - "6334" # Qdrant gRPC API 포트
    ports: # (선택 사항) 호스트에서 Qdrant UI/API에 직접 접근하려면 주석 해제
      - "6333:6333"
      - "6334:6334"

  inference-server:
    build:
      context: ./inference
      dockerfile: Dockerfile
    volumes:
      # 생성된 이미지를 Django와 공유하기 위한 볼륨
      - ./mediafiles:/app/generated_images
      - ./models:/app/models:ro
    ports:
      - "8001:8001"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    # GPU를 사용하기 위한 필수 설정
    environment:
      - BASE_MODEL_PATH=/app/models/exaone_4.0_1.2b
      - ADAPTER_PATH=/app/models/llm_finetuned_model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


# Docker 볼륨 정의 (데이터 영속성을 위함)
volumes:
  postgres_data:
  qdrant_data: