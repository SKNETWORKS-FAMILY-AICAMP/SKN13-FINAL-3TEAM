services:
  # Django + Gunicorn 서비스
  django_gunicorn:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        apk add --no-cache netcat-openbsd &&
        chmod +x /wait-for-it.sh &&
        /wait-for-it.sh inference-server:8001 --
        gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 180
      "
    volumes:
      - .:/app
      - /app/node_modules
      - ./mediafiles:/app/mediafiles
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - qdrant
      - inference-server

  # Nginx 서비스
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./react/build:/usr/share/nginx/html:ro
    depends_on:
      - django_gunicorn

  # PostgreSQL 서비스
  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    expose:
      - "5432"

  # Qdrant 서비스
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    env_file:
      - .env
    expose:
      - "6333"
      - "6334"
    ports:
      - "6333:6333"
      - "6334:6334"

  # Inference 서버
  inference-server:
    build:
      context: ./inference
      dockerfile: Dockerfile
    volumes:
      - ./mediafiles:/app/generated_images
      - ./models:/app/models:ro
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      - BASE_MODEL_PATH=/app/models/exaone_4.0_1.2b
      - ADAPTER_PATH=/app/models/llm_finetuned_model

# 볼륨 설정
volumes:
  postgres_data:
  qdrant_data:
