services:
  # Django + Gunicorn 서비스
  django_gunicorn:
    build:
      context: .
      dockerfile: Dockerfile
    command: [
      "sh", "-c",
      "curl -sSL https://raw.githubusercontent.com/vishnubob/wait-for-it/master/wait-for-it.sh -o /wait-for-it.sh && \
      chmod +x /wait-for-it.sh && \
      gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers=1 --threads=4 --timeout 0"
    ]
    volumes:
      - .:/app
      - /app/node_modules
      - ./mediafiles:/app/mediafiles
      - static_volume:/app/staticfiles
      - ../text_data:/app/text_data
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - qdrant
      # - inference-server

  # Nginx 서비스
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./react/build:/usr/share/nginx/html:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - django_gunicorn

  # # PostgreSQL 서비스
  # postgres:
  #   image: postgres:15-alpine
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   env_file:
  #     - .env
  #   expose:
  #     - "5432"

  # Qdrant 서비스
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    env_file:
      - .env
    expose:
      - "6333"
      - "6334"
    ports:
      - "6333:6333"
      - "6334:6334"

