services:
  # Django + Gunicorn 서비스
  django_gunicorn:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        apt-get update && apt-get install -y netcat-openbsd &&
        chmod +x /wait-for-it.sh &&
        /wait-for-it.sh inference-server:8001 --
        gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 180
      "
    volumes:
      - .:/app
      - /app/node_modules
      - ./mediafiles:/app/mediafiles
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - qdrant
      - inference-server

  # Nginx 서비스
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./react/build:/usr/share/nginx/html:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - django_gunicorn

  # # PostgreSQL 서비스
  # postgres:
  #   image: postgres:15-alpine
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   env_file:
  #     - .env
  #   expose:
  #     - "5432"

  # Qdrant 서비스
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    env_file:
      - .env
    expose:
      - "6333"
      - "6334"
    ports:
      - "6333:6333"
      - "6334:6334"

  # Inference 서버
  inference-server:
    build:
      context: ./inference
      dockerfile: Dockerfile
    volumes:
      - ./mediafiles:/app/generated_images
      # - ./models:/app/models:ro
      - hf_cache:/cache/huggingface
    ports:
      - "8001:8001"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Airflow 서비스
  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile.airflow
    command: scheduler
    env_file:
      - .env
    volumes:
      - .:/app
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - ${DOCKER_GROUP_ID}
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/airflow_db

  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile.airflow
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-scheduler
    env_file:
      - .env
    volumes:
      - .:/app
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - ${DOCKER_GROUP_ID}
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/airflow_db

# 볼륨 설정
volumes:
  qdrant_data:
  static_volume:
  hf_cache:

