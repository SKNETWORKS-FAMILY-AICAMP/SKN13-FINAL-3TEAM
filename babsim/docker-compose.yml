services:
  # Django + Gunicorn 서비스
  django_gunicorn:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        apk add --no-cache netcat-openbsd &&
        chmod +x /wait-for-it.sh &&
        /wait-for-it.sh inference-server:8001 --
        gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 180
      "
    volumes:
      - .:/app
      - /app/node_modules
      - ./mediafiles:/app/mediafiles
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - qdrant
      - inference-server

  # Nginx 서비스
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./react/build:/usr/share/nginx/html:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - django_gunicorn

  # PostgreSQL 서비스
  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    expose:
      - "5432"

  # Qdrant 서비스
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    env_file:
      - .env
    expose:
      - "6333"
      - "6334"
    ports:
      - "6333:6333"
      - "6334:6334"

  # Inference 서버
  inference-server:
    build:
      context: ./inference
      dockerfile: Dockerfile
    volumes:
      - ./mediafiles:/app/generated_images
      # - ./models:/app/models:ro
      - hf_cache:/cache/huggingface
    ports:
      - "8001:8001"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      # === vLLM API 설정 ===
      # 방법 1: nginx를 통한 프록시 (SSH 터널링 필요)
      - VLLM_API_BASE=http://nginx/vllm
      # 방법 2: RunPod 공개 IP 직접 연결 (SSH 터널링 불필요)
      # - VLLM_API_BASE=http://your-runpod-public-ip:8000
      - VLLM_MODEL_NAME=kakaocorp/kanana-1.5-8b-instruct-2505
      - VLLM_ADAPTER_NAME=ki-student/kanana-finetuned-model-v1
      
      # === SSH 터널링 설정 (필요시 설정) ===
      # - SSH_TUNNEL_HOST=username@your-runpod-public-ip
      # - SSH_TUNNEL_PORT=22
      # - SSH_PRIVATE_KEY_PATH=/path/to/private/key
      
      # === vLLM API 인증 (필요시 설정) ===
      # - VLLM_API_KEY=your_api_key_here

      # # - BASE_MODEL_PATH=/app/models/kanana-1.5-8b-instruct-2505
      # # - ADAPTER_PATH=/app/models/kanana_finetuned_model
      # - HF_BASE_REPO=kakaocorp/kanana-1.5-8b-instruct-2505    
      # - HF_BASE_REV=main               
      # - HF_ADPT_REPO=ki-student/kanana-finetuned-model-v1             
      # - HF_ADPT_REV=main               
      # # === 캐시/전송 최적화 ===
      # - HF_HOME=/cache/huggingface
      # - HF_HUB_ENABLE_HF_TRANSFER=1
      # # === 양자화 폴백 스위치(원하면 제어) ===
      # - DISABLE_4BIT=false
      # - DISABLE_8BIT=false

  # Airflow 서비스
  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile.airflow
    command: scheduler
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - .:/app
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db

  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile.airflow
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-scheduler
    env_file:
      - .env
    volumes:
      - .:/app
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db

# 볼륨 설정
volumes:
  postgres_data:
  qdrant_data:
  static_volume:
  hf_cache:
