services:
  # Django + Gunicorn 서비스
  django_gunicorn:
    build:
      context: .
      dockerfile: Dockerfile
    command: [
      "sh", "-c",
      "curl -sSL https://raw.githubusercontent.com/vishnubob/wait-for-it/master/wait-for-it.sh -o /wait-for-it.sh && \
      chmod +x /wait-for-it.sh && \
      /wait-for-it.sh inference-server:8001 -- \
      gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers=1 --threads=4 --timeout 0"
    ]
    volumes:
      - .:/app
      - /app/node_modules
      - ./mediafiles:/app/mediafiles
      - static_volume:/app/staticfiles
      - ../text_data:/app/text_data
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - qdrant
      - inference-server

  # Nginx 서비스
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./react/build:/usr/share/nginx/html:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - django_gunicorn

  # PostgreSQL 서비스
  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    expose:
      - "5432"

  # PostgreSQL UI (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # Qdrant 서비스
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    env_file:
      - .env
    expose:
      - "6333"
      - "6334"
    ports:
      - "6333:6333"
      - "6334:6334"

  # Inference 서버 (CPU 전용)
  inference-server:
    build:
      context: ./inference
      dockerfile: Dockerfile.simple
      args:
        BUILDKIT_INLINE_CACHE: 1
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    volumes:
      - ./mediafiles:/app/generated_images
      - hf_cache:/cache/huggingface
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      # === CPU 전용 설정 ===
      - TORCH_DEVICE=cpu
      - CUDA_VISIBLE_DEVICES=""
      - HF_HOME=/cache/huggingface

  # Embedding API 서버
  # embedding_api:
  #   image: kiwonjune/babsim-embedding:latest
  #   command: sh -c "pip install uvicorn && uvicorn main:app --host 0.0.0.0 --port 8002"
  #   ports:
  #     - "8002:8002"
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/').read()"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 30s

# 볼륨 설정
volumes:
  postgres_data:
  qdrant_data:
  pgadmin_data:
  static_volume:
  hf_cache:
